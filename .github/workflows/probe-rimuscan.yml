name: Probe RimuScans

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect rimuscan.fr Next.js payloads
        run: |
          python3 - <<'PY'
          import urllib.request, re, json

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "fr"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.getcode(), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, "ERR: %r" % e

          push_re = re.compile(r'self\.__next_f\.push\(\s*\[\s*1\s*,\s*"(.*?)"\s*\]\s*\)', re.S)

          def blob_of(html):
              parts = push_re.findall(html)
              blob = "".join(parts)
              # unescape the JS string encoding
              blob = blob.encode().decode("unicode_escape", "replace")
              return blob

          def summarize(label, url):
              code, html = fetch(url)
              print("\n===== %s -> %s  (HTTP %s, %d bytes) =====" % (label, url, code, len(html) if html else 0))
              if not html or html.startswith("ERR:"):
                  print(html)
                  return None
              blob = blob_of(html)
              print("  __next_f blob len:", len(blob))
              print('  count "slug":', blob.count('"slug"'))
              print('  count "chapters":', blob.count('"chapters"'))
              print('  has "mangas":', '"mangas"' in blob, ' has "series":', '"series"' in blob)
              slugs = re.findall(r'"slug":"([^"]+)"', blob)
              uniq = list(dict.fromkeys(slugs))
              print("  unique slugs (%d):" % len(uniq), uniq[:15])
              return blob, uniq

          # Homepage
          home = summarize("HOME", "https://rimuscan.fr/")

          # Catalogue candidates
          for path in ["/catalogue", "/series", "/catalog", "/browse", "/library", "/mangas", "/all"]:
              summarize("CAT" + path, "https://rimuscan.fr" + path)

          # Pick a slug to inspect a detail page
          slug = None
          if home:
              _, uniq = home
              slug = uniq[0] if uniq else None
          slug = slug or "the-dungeon-painter"
          print("\n##### DETAIL PROBE for slug:", slug)

          detail_blob = None
          for path in ["/manga/", "/serie/", "/series/", "/comic/", "/webtoon/"]:
              url = "https://rimuscan.fr" + path + slug
              code, html = fetch(url)
              has_ch = ('"chapters"' in html) if html else False
              print("  %-10s HTTP %s  has_chapters=%s  bytes=%d" % (path, code, has_ch, len(html) if html else 0))
              if html and has_ch and detail_blob is None:
                  detail_blob = blob_of(html)
                  detail_url = url

          if detail_blob:
              print("\n----- DETAIL blob window around first \"chapters\": -----")
              i = detail_blob.find('"chapters"')
              print(detail_blob[max(0,i-1200):i+1500])
              print("\n----- DETAIL blob window around manga object (\"slug\":\"%s\"): -----" % slug)
              j = detail_blob.find('"slug":"%s"' % slug)
              print(detail_blob[max(0,j-1500):j+900])
          else:
              print("  !! No detail URL pattern exposed chapters")

          # Reader page (images)
          if slug:
              rurl = "https://rimuscan.fr/read/%s/1" % slug
              code, html = fetch(rurl)
              print("\n===== READER %s (HTTP %s) =====" % (rurl, code))
              if html:
                  imgs = re.findall(r'src="([^"]*?/uploads/[^"]*)"', html)
                  print("  uploads img srcs (%d):" % len(imgs), imgs[:8])
                  b = blob_of(html)
                  k = b.find('"images"')
                  if k != -1:
                      print("  images window:", b[k:k+600])
          PY